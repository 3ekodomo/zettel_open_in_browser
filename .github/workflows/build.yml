name: Build and Release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew :plugin-btn-browser:assembleRelease

      - name: Rename APK
        run: mv plugin-btn-browser/build/outputs/apk/release/plugin-btn-browser-release-unsigned.apk "ZN open in browser.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zn-open-in-browser-apk
          path: "ZN open in browser.apk"

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          files: "ZN open in browser.apk"
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
